name: Advisory watch

on:
  schedule:
    - cron: '0 0 * * *'    # 매일 00:00 UTC = 09:00 KST (README 권장 주기)
  workflow_dispatch: {}    # 수동 실행(첫 seed·테스트용)

permissions:
  contents: read           # DB는 캐시에 두므로 repo 쓰기 불필요

# 동시 실행 방지 — 겹치면 SQLite 락/캐시 경합
concurrency:
  group: advisory-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 의존성 0(stdlib) — pip install 없음

      # advisories.db를 실행 간 유지 — 없으면 매번 seed 모드라 "신규만 알림"이 성립 안 함.
      # 캐시는 불변이라 run_id로 매번 새로 저장하고 restore-keys 접두사로 최신본을 복원.
      - name: Restore advisories DB
        uses: actions/cache/restore@v4
        with:
          path: data
          key: advisory-db-${{ github.run_id }}
          restore-keys: |
            advisory-db-

      # Secrets를 .env로 기록 — notify.py는 os.environ이 아니라 .env 파일에서만 읽음.
      # 값은 env로 주입(로그 마스킹), 셸이 파일 생성. 미설정이면 빈 값 → notify가 콘솔 대체(정상).
      - name: Configure mail (.env)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          {
            echo "GMAIL_USER=${GMAIL_USER}"
            echo "GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}"
            echo "MAIL_TO=${MAIL_TO}"
          } > .env

      - name: Run watcher
        id: watch
        run: |
          set +e
          python watcher.py
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "watcher exit code: ${code}"

      # 종료코드와 무관하게 DB 상태를 저장(신규 적재분 유실 방지)
      - name: Save advisories DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: advisory-db-${{ github.run_id }}

      # exit 3(소스 오류)·4(메일 실패)면 job 실패 → GitHub 기본 알림. 0이면 정상.
      - name: Fail on watcher error
        if: always()
        run: |
          code="${{ steps.watch.outputs.code }}"
          case "${code}" in
            0) echo "정상 — 신규 없음 또는 처리·발송 완료" ;;
            3) echo "::error::소스 오류(exit 3) — fetch/파싱 실패 또는 entry_id 전건 스킵"; exit 1 ;;
            4) echo "::error::신규 권고문 있으나 메일 발송 실패(exit 4)"; exit 1 ;;
            *) echo "::error::예상외 종료(exit ${code})"; exit 1 ;;
          esac
