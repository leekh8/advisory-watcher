name: Advisory watch

on:
  schedule:
    # 매일 00:23 UTC = 09:23 KST. 정각을 피한다.
    #
    # 공식 문서(events-that-trigger-workflows 의 schedule 절): "High load times
    # include the start of every hour", "To decrease the chance of delay, schedule
    # your workflow to run at a different time of the hour", "If the load is
    # sufficiently high enough, some queued jobs may be dropped." 정각에 두면
    # 늦어지는 데 그치지 않고 그날 회차가 아예 빠질 수 있다.
    #
    # 이 값을 바꾸는 것 자체가 2026-11-10 에 이 워크플로를 다시 켠 방법이기도
    # 하다. 08-20 뒤로 커밋이 없어 10-20 에 disabled_inactivity 로 꺼졌는데,
    # 공식 문서가 적은 재활성화 조건은 그냥 커밋이 아니라 cron 을 바꾸는
    # 커밋이다: "if a user with write permissions to the repository makes a
    # commit that changes the cron schedule on the workflow, the workflow will be
    # reactivated". 그래서 21일간 수집이 0 이었다.
    - cron: '23 0 * * *'

  # 수동 실행. seed 는 진짜 첫 설치에만 켠다.
  #
  # 🛑 켜면 그 회차에 수집한 권고문을 알림 없이 "이미 알림"으로 찍는다. 상태를
  #    잃은 뒤(캐시 삭제 등) 켜면 그 기간 권고문이 메일 없이 사라진다.
  #    11-10 에 그 일이 났다. watcher.py 의 seed 주석 참고.
  workflow_dispatch:
    inputs:
      seed:
        description: '첫 설치다. 수집분을 알림 없이 적재만 한다'
        type: boolean
        default: false

permissions:
  contents: read           # DB는 캐시에 두므로 repo 쓰기 불필요

# 동시 실행 방지 — 겹치면 SQLite 락/캐시 경합
concurrency:
  group: advisory-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # 의존성 0(stdlib) — pip install 없음

      # advisories.db를 실행 간 유지 — 없으면 매번 seed 모드라 "신규만 알림"이 성립 안 함.
      # 캐시는 불변이라 run_id로 매번 새로 저장하고 restore-keys 접두사로 최신본을 복원.
      - name: Restore advisories DB
        uses: actions/cache/restore@v6
        with:
          path: data
          key: advisory-db-${{ github.run_id }}
          restore-keys: |
            advisory-db-

      # Secrets를 .env로 기록 — notify.py는 os.environ이 아니라 .env 파일에서만 읽음.
      # 값은 env로 주입(로그 마스킹), 셸이 파일 생성.
      #
      # 미설정이어도 .env 파일 자체는 만들어진다. 그래서 예전 로그의 ".env 없음"은
      # 틀린 진단이었다. 파일은 있었고 빈 것은 Secrets였다. 지금은 mail_status()가 구분한다.
      - name: Configure mail (.env)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          {
            echo "GMAIL_USER=${GMAIL_USER}"
            echo "GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}"
            echo "MAIL_TO=${MAIL_TO}"
          } > .env
          if [ -z "${GMAIL_USER}" ] || [ -z "${GMAIL_APP_PASSWORD}" ]; then
            echo "::warning::메일 Secrets 미설정. 수집은 계속하되 발송은 실패로 처리한다. 권고문은 미발송 큐에 남아 설정 후 한 번에 나간다."
          fi

      - name: Run watcher
        id: watch
        env:
          SEED: ${{ inputs.seed }}
        run: |
          set +e
          if [ "${SEED}" = "true" ]; then
            echo "::warning::seed 모드. 이번 회차 권고문은 알림 없이 적재만 한다."
            python watcher.py --require-mail --seed
          else
            python watcher.py --require-mail
          fi
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "watcher exit code: ${code}"

      # 종료코드와 무관하게 DB 상태를 저장(신규 적재분 유실 방지)
      - name: Save advisories DB
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: advisory-db-${{ github.run_id }}

      # exit 3(소스 오류), 4(발송 실패), 5(메일 미설정)면 job 실패 -> GitHub 기본 알림.
      #
      # 미설정을 성공으로 넘기던 때가 이 저장소를 10일간 조용히 죽여 뒀다. 매일 초록불이
      # 켜지는 동안 권고문 18건이 지나갔다. 무인 실행에서 콘솔 출력은 알림이 아니다.
      - name: Fail on watcher error
        if: always()
        run: |
          code="${{ steps.watch.outputs.code }}"
          case "${code}" in
            0) echo "정상: 신규 없음 또는 처리, 발송 완료" ;;
            3) echo "::error::소스 오류(exit 3) — fetch/파싱 실패 또는 entry_id 전건 스킵"; exit 1 ;;
            4) echo "::error::보낼 권고문이 있으나 발송 실패(exit 4). 미발송 큐에 남아 다음 회차에 재시도"; exit 1 ;;
            5) echo "::error::메일 미설정(exit 5). Secrets 3종을 등록하라. 권고문은 유실되지 않고 큐에 쌓인다"; exit 1 ;;
            *) echo "::error::예상외 종료(exit ${code})"; exit 1 ;;
          esac
